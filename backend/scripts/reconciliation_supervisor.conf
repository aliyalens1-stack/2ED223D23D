# Sample supervisor program — NOT installed by default. Opt-in.
#
# To enable nightly reconciliation supervision:
#
#   sudo cp /app/backend/scripts/reconciliation_supervisor.conf \
#           /etc/supervisor/conf.d/
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl start reconciliation-supervisor
#
# To disable:
#
#   sudo supervisorctl stop reconciliation-supervisor
#   sudo rm /etc/supervisor/conf.d/reconciliation_supervisor.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#
# Artefacts land in /app/audit/reconciliation_<UTC-timestamp>.{json,md}
# Structured log lines (one per run) land in:
#   /var/log/supervisor/reconciliation.out.log    INFO + WARN envelopes
#   /var/log/supervisor/reconciliation.err.log    stderr only (should stay empty)
#
# Grep cheat-sheet:
#   grep '"event":"reconciliation.audit.completed"'             reconciliation.out.log
#   grep '"event":"reconciliation.audit.divergences_detected"'  reconciliation.out.log
#   grep '"severity":"HIGH"'                                    reconciliation.out.log
#
# This program is read-only against MongoDB and writes ONLY to /app/audit/
# plus its supervisor log files. No DB mutation, no other side effects.

[program:reconciliation-supervisor]
command=/root/.venv/bin/python /app/backend/scripts/reconciliation_supervisor.py --loop --hour 3
directory=/app/backend
autostart=false
autorestart=true
startsecs=5
stderr_logfile=/var/log/supervisor/reconciliation.err.log
stdout_logfile=/var/log/supervisor/reconciliation.out.log
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
